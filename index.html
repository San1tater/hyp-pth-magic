<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>⚡ 可譽波特 · 魔法對決</title>

    <style>
        /* ===== 全局重置 & 字體 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Sans+TC:wght@400;600;700&display=swap');

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Noto Sans TC', 'Cinzel', serif;
            background: #0b0e14;
            background-image: radial-gradient(ellipse at 20% 50%, #1a1f2e 0%, #0b0e14 70%);
            color: #f0e6d3;
        }

        /* ===== 主容器 — 全屏填滿 ===== */
        .game-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: rgba(11, 14, 20, 0.92);
            backdrop-filter: blur(8px);
            padding: 18px 28px 22px;
            overflow: hidden;
            border: none;
            box-shadow: none;
            border-radius: 0;
        }

        /* ===== 頂欄 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.15);
            margin-bottom: 12px;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(253, 160, 133, 0.15);
        }
        .title span {
            font-weight: 400;
            font-size: 1.0rem;
            opacity: 0.7;
            -webkit-text-fill-color: #b8a88a;
            background: none;
        }

        .lang-toggle {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 4px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            flex-shrink: 0;
        }
        .lang-toggle button {
            background: transparent;
            border: none;
            color: #8a7e6a;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Noto Sans TC', sans-serif;
            letter-spacing: 0.5px;
        }
        .lang-toggle button.active {
            background: rgba(212, 175, 55, 0.2);
            color: #f0d68a;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.05);
        }
        .lang-toggle button:hover:not(.active) {
            color: #c8bca0;
        }

        /* ===== 狀態欄 ===== */
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 20px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 40px;
            padding: 8px 24px 8px 28px;
            margin-bottom: 14px;
            border: 1px solid rgba(212, 175, 55, 0.06);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #d4cdbc;
        }
        .status-item .icon {
            font-size: 1.4rem;
        }
        .status-item .value {
            color: #f0e6d3;
            font-size: 1.4rem;
            font-weight: 700;
            min-width: 28px;
            text-align: center;
        }
        .status-item .value.score-val {
            color: #f6d365;
        }
        .status-item .value.lives-val {
            color: #ff7e6b;
            position: relative;
        }

        /* 玩家受傷顯示 — 緊跟在生命值右側 */
        .damage-taken-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: 8px;
            gap: 2px;
            font-size: 0.9rem;
            font-weight: 700;
            max-height: 60px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .damage-taken-container .taken-item {
            color: #ff6b5a;
            text-shadow: 0 0 20px rgba(255, 80, 50, 0.3);
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4a84a, #b8923a);
            border: none;
            color: #0b0e14;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 10px 34px;
            border-radius: 60px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
            border: 1px solid rgba(255, 215, 100, 0.15);
            flex-shrink: 0;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.35);
            background: linear-gradient(135deg, #e0bc5a, #c8a244);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-primary.danger {
            background: linear-gradient(135deg, #b84a3a, #8a3228);
            box-shadow: 0 4px 20px rgba(184, 74, 58, 0.25);
        }
        .btn-primary.danger:hover:not(:disabled) {
            background: linear-gradient(135deg, #d05a48, #a03a2e);
            box-shadow: 0 8px 30px rgba(184, 74, 58, 0.35);
        }
        .btn-primary.escape {
            background: linear-gradient(135deg, #6a7a8a, #4a5a6a);
            box-shadow: 0 4px 20px rgba(100, 120, 140, 0.2);
        }
        .btn-primary.escape:hover:not(:disabled) {
            background: linear-gradient(135deg, #7a8a9a, #5a6a7a);
        }

        /* ===== 主區域 — 左右佈局 ===== */
        .main-area {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: row;
            gap: 18px;
            margin-bottom: 14px;
        }

        /* ===== 左側：敵人區域 ===== */
        .enemy-area {
            flex: 1 1 56%;
            min-width: 0;
            min-height: 0;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 28px;
            padding: 18px;
            border: 1px solid rgba(212, 175, 55, 0.05);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 敵人內容：垂直排列，頭像為主 */
        #enemyContent {
            width: 100%;
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .enemy-avatar {
            flex: 0 0 auto;
            height: 70%;
            aspect-ratio: 1 / 1;
            max-width: 88%;
            border-radius: 50%;
            background: rgba(30, 34, 50, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            border: 3px solid rgba(212, 175, 55, 0.18);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.45);
        }
        .enemy-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .enemy-avatar .emoji-fallback {
            font-size: 8rem;
            line-height: 1;
        }

        .enemy-info {
            flex: 0 0 auto;
            width: 100%;
            max-width: 88%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .enemy-name {
            font-family: 'Cinzel', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #f0e6d3;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            text-align: center;
        }
        .enemy-name .sub {
            font-size: 1.0rem;
            font-weight: 400;
            color: #8a7e6a;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .enemy-status-text {
            font-size: 0.95rem;
            color: #b8a88a;
            margin-top: 2px;
            min-height: 1.4em;
            text-align: center;
        }
        /* 縮小的血量條 */
        .enemy-hp-bar {
            margin-top: 8px;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .enemy-hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f6d365, #fda085);
            border-radius: 20px;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px rgba(253, 160, 133, 0.1);
        }
        .enemy-hp-fill.low {
            background: linear-gradient(90deg, #ff6b5a, #ff4a3a);
        }

        /* 對敵傷害列表 — 懸浮於敵人區域右上角 */
        .damage-dealt-container {
            position: absolute;
            top: 18px;
            right: 22px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            max-height: 62%;
            overflow-y: auto;
            padding-left: 8px;
            pointer-events: none;
        }
        .damage-dealt-container .dealt-item {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: #ff6b5a;
            text-shadow: 0 0 30px rgba(255, 80, 50, 0.3);
            white-space: nowrap;
        }
        .damage-dealt-container .dealt-item.critical {
            color: #ffd93d;
            font-size: 2.0rem;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
        }
        .damage-dealt-container .dealt-item.ineffective {
            color: #6a7a8a;
            font-size: 1.2rem;
            text-shadow: 0 0 20px rgba(100, 120, 140, 0.2);
        }

        /* ===== 右側面板 ===== */
        .right-panel {
            flex: 1 1 44%;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ===== 咒語選擇 — 2×2 網格，置於右上半部 ===== */
        .spell-selector {
            flex: 1 1 56%;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
        }
        .spell-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(212, 175, 55, 0.08);
            border-radius: 22px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Noto Sans TC', sans-serif;
            color: #b8a88a;
            font-weight: 600;
            font-size: 1.2rem;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: visible;
        }
        .spell-btn .emoji {
            display: block;
            font-size: 2.6rem;
            margin-bottom: 4px;
            line-height: 1;
        }
        .spell-btn .label {
            display: block;
            font-size: 1.35rem;
            letter-spacing: 3px;
            font-weight: 700;
        }
        .spell-btn:hover:not(.active) {
            background: rgba(212, 175, 55, 0.06);
            border-color: rgba(212, 175, 55, 0.2);
            transform: translateY(-2px);
        }
        .spell-btn.active {
            background: rgba(212, 175, 55, 0.12);
            border-color: #d4a84a;
            color: #f0e6d3;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
        }
        .spell-btn .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #d4a84a;
            color: #0b0e14;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .spell-btn.active .badge {
            opacity: 1;
        }

        /* 最有效咒語 — 邊緣金光引導 */
        .spell-btn.best {
            border-color: #f6d365;
            color: #f6d365;
            animation: goldenGlow 1.7s ease-in-out infinite;
        }
        .spell-btn.best .emoji {
            filter: drop-shadow(0 0 10px rgba(246, 211, 101, 0.55));
        }
        @keyframes goldenGlow {
            0%,
            100% {
                box-shadow:
                    0 0 10px 2px rgba(246, 211, 101, 0.45),
                    0 0 26px 6px rgba(212, 175, 55, 0.22),
                    inset 0 0 14px rgba(246, 211, 101, 0.12);
            }
            50% {
                box-shadow:
                    0 0 22px 6px rgba(246, 211, 101, 0.9),
                    0 0 52px 16px rgba(212, 175, 55, 0.42),
                    inset 0 0 26px rgba(246, 211, 101, 0.3);
            }
        }

        /* ===== 咒語顯示區 — 右下半部：拼音 + 文字 ===== */
        .spell-display {
            flex: 1 1 44%;
            min-height: 0;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 24px;
            padding: 14px 24px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .spell-display .spell-pinyin {
            font-size: 2.0rem;
            color: #f6d365;
            font-weight: 700;
            letter-spacing: 8px;
            margin-bottom: 6px;
            text-shadow: 0 0 24px rgba(246, 211, 101, 0.35);
            order: 0;
        }
        .spell-display .spell-chars {
            font-size: 4.6rem;
            font-weight: 700;
            color: #f0e6d3;
            letter-spacing: 12px;
            font-family: 'Cinzel', serif;
            line-height: 1.1;
            order: 1;
        }
        .spell-display .empty-hint {
            color: #4a4e5a;
            font-size: 1.1rem;
        }

        /* ===== 操作區 ===== */
        .action-area {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding-top: 4px;
        }
        .action-area .btn-record {
            background: linear-gradient(135deg, #3a4a6a, #2a3a5a);
            border: none;
            color: #f0e6d3;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 14px 44px;
            border-radius: 60px;
            cursor: pointer;
            font-family: 'Noto Sans TC', sans-serif;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .action-area .btn-record:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #4a5a7a, #3a4a6a);
        }
        .action-area .btn-record:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .action-area .btn-record.recording {
            background: linear-gradient(135deg, #b84a3a, #8a3228);
            animation: pulse-red 1.2s infinite;
        }
        @keyframes pulse-red {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(184, 74, 58, 0.3);
            }
            50% {
                box-shadow: 0 0 0 16px rgba(184, 74, 58, 0);
            }
        }

        .action-area .feedback {
            flex: 1;
            min-width: 200px;
            text-align: center;
            font-size: 1.05rem;
            color: #b8a88a;
            padding: 10px 18px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.2);
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(212, 175, 55, 0.04);
        }
        .action-area .feedback.success {
            color: #6bcb8a;
            border-color: rgba(80, 200, 120, 0.15);
        }
        .action-area .feedback.error {
            color: #ff6b5a;
            border-color: rgba(255, 80, 50, 0.15);
        }
        .action-area .feedback.info {
            color: #6aa8d4;
            border-color: rgba(80, 160, 220, 0.15);
        }

        /* ===== 遊戲結束遮罩 ===== */
        .game-over-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 28px;
            z-index: 30;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
            color: #f0e6d3;
            font-family: 'Cinzel', serif;
        }
        .game-over-overlay.show {
            display: flex;
        }
        .game-over-overlay .big-text {
            font-size: 3.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b5a, #ff4a3a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .game-over-overlay .big-text.victory {
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .game-over-overlay .sub-text {
            font-size: 1.4rem;
            color: #b8a88a;
            -webkit-text-fill-color: #b8a88a;
        }

        /* ===== iPad 橫屏專屬微調 ===== */
        @media (orientation: landscape) and (min-width: 768px) {
            .game-container {
                padding: 20px 36px 28px;
            }
            .main-area {
                gap: 24px;
            }
            .enemy-area {
                padding: 22px 28px;
            }
            .enemy-avatar {
                height: 72%;
                font-size: 9rem;
            }
            .enemy-avatar .emoji-fallback {
                font-size: 9rem;
            }
            .enemy-name {
                font-size: 2.2rem;
            }
            .spell-btn .emoji {
                font-size: 3.0rem;
            }
            .spell-btn .label {
                font-size: 1.6rem;
            }
            .spell-display .spell-chars {
                font-size: 5.6rem;
            }
            .spell-display .spell-pinyin {
                font-size: 2.3rem;
            }
            .action-area .btn-record {
                font-size: 1.3rem;
                padding: 16px 52px;
            }
            .damage-dealt-container .dealt-item {
                font-size: 2.0rem;
            }
            .damage-dealt-container .dealt-item.critical {
                font-size: 2.6rem;
            }
        }

        /* ===== 響應式（手機豎屏） ===== */
        @media (max-width: 767px) {
            .game-container {
                padding: 12px 14px 16px;
            }
            .title {
                font-size: 1.2rem;
            }
            .title span {
                font-size: 0.7rem;
            }
            .lang-toggle button {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .status-bar {
                padding: 6px 14px;
                gap: 6px;
                border-radius: 30px;
                flex-wrap: wrap;
            }
            .status-item {
                font-size: 0.85rem;
            }
            .status-item .value {
                font-size: 1.0rem;
                min-width: 20px;
            }
            .btn-primary {
                font-size: 0.85rem;
                padding: 6px 16px;
            }

            /* 手機改為上下佈局 */
            .main-area {
                flex-direction: column;
                gap: 10px;
            }
            .enemy-area {
                flex: 1 1 42%;
                padding: 12px;
            }
            #enemyContent {
                gap: 8px;
            }
            .enemy-avatar {
                height: 68%;
                max-width: 62%;
                font-size: 3.6rem;
            }
            .enemy-avatar .emoji-fallback {
                font-size: 3.6rem;
            }
            .enemy-name {
                font-size: 1.1rem;
            }
            .enemy-name .sub {
                font-size: 0.75rem;
            }
            .enemy-status-text {
                font-size: 0.8rem;
            }
            .enemy-hp-bar {
                height: 6px;
            }

            .right-panel {
                flex: 1 1 58%;
                gap: 8px;
            }
            .spell-selector {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 8px;
            }
            .spell-btn {
                padding: 6px 4px;
                border-radius: 16px;
            }
            .spell-btn .emoji {
                font-size: 1.6rem;
            }
            .spell-btn .label {
                font-size: 1.05rem;
                letter-spacing: 1px;
            }
            .spell-display .spell-chars {
                font-size: 2.6rem;
                letter-spacing: 6px;
            }
            .spell-display .spell-pinyin {
                font-size: 1.1rem;
                letter-spacing: 3px;
            }
            .action-area {
                gap: 8px;
            }
            .action-area .btn-record {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            .action-area .feedback {
                font-size: 0.85rem;
                min-height: 40px;
                min-width: 100px;
            }
            .damage-dealt-container .dealt-item {
                font-size: 1.2rem;
            }
            .damage-dealt-container .dealt-item.critical {
                font-size: 1.6rem;
            }
            .damage-taken-container .taken-item {
                font-size: 0.8rem;
            }
            .game-over-overlay .big-text {
                font-size: 2.2rem;
            }
            .game-over-overlay .sub-text {
                font-size: 1.0rem;
            }
        }

        @media (max-width: 420px) {
            .header {
                flex-wrap: wrap;

        function getSpellDisplay(pos) {
            const key = POS_TO_SPELL[pos];
            if (!key) return { chars: '', pinyin: '' };
            const spell = SPELLS[key];
            const chars = key;
            const pinyinRaw = spell.pinyin;
            const pinyin = pinyinRaw.split('|').map(s => {
                const num = parseInt(s.slice(-1));
                const base = s.slice(0, -1);
                const toneMap = {
                    'a': ['a', 'ā', 'á', 'ǎ', 'à'],
                    'e': ['e', 'ē', 'é', 'ě', 'è'],
                    'i': ['i', 'ī', 'í', 'ǐ', 'ì'],
                    'o': ['o', 'ō', 'ó', 'ǒ', 'ò'],
                    'u': ['u', 'ū', 'ú', 'ǔ', 'ù'],
                    'ü': ['ü', 'ǖ', 'ǘ', 'ǚ', 'ǜ']
                };
                for (const [vowel, arr] of Object.entries(toneMap)) {
                    if (base.includes(vowel)) {
                        const idx = base.indexOf(vowel);
                        const before = base.slice(0, idx);
                        const after = base.slice(idx + 1);
                        return before + arr[num] + after;
                    }
                }
                return base;
            });
            return { chars, pinyin: pinyin.join(' ') };
        }

        // ================================================================

        async function buildWsUrl(apiKey, apiSecret, appid, host, path) {
            const date = new Date().toUTCString();
            const requestLine = `GET ${path} HTTP/1.1`;
            const signatureOrigin = `host: ${host}\ndate: ${date}\n${requestLine}`;

            const encoder = new TextEncoder();
            const keyData = encoder.encode(apiSecret);
            const messageData = encoder.encode(signatureOrigin);

            const cryptoKey = await crypto.subtle.importKey(
                'raw', keyData, { name: 'HMAC', hash: 'SHA-256' },
                false, ['sign']
            );
            const signatureBuffer = await crypto.subtle.sign('HMAC', cryptoKey, messageData);
            const signature = btoa(String.fromCharCode(...new Uint8Array(signatureBuffer)));

            const authorization = `api_key="${apiKey}", algorithm="hmac-sha256", headers="host date request-line", signature="${signature}"`;
            const authorizationBase64 = btoa(authorization);

            return `wss://${host}${path}?authorization=${encodeURIComponent(authorizationBase64)}&date=${encodeURIComponent(date)}&host=${encodeURIComponent(host)}`;
        }

            }
        }

        async function startPCMCapture() {
            if (state.audioContext && state.audioContext.state === 'running') {
                return;
            }

            try {
                let stream = state.mediaStream;
                if (!stream) {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            sampleRate: 16000,
                            channelCount: 1,
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                        }
                    });
                    state.mediaStream = stream;
                }

                let audioCtx = state.audioContext;
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                } else if (!audioCtx) {
                    audioCtx = new AudioContext({ sampleRate: 16000 });
                    state.audioContext = audioCtx;
                } else {
                    audioCtx = new AudioContext({ sampleRate: 16000 });
                    state.audioContext = audioCtx;
                }

                const source = audioCtx.createMediaStreamSource(stream);
                state.sourceNode = source;

                const scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
                state.scriptNode = scriptNode;

                const pcmChunks = [];
                state.pcmChunks = pcmChunks;

                scriptNode.onaudioprocess = (event) => {
                    const inputData = event.inputBuffer.getChannelData(0);
                    const int16 = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        const s = Math.max(-1, Math.min(1, inputData[i]));
                        int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    pcmChunks.push(int16);
                };

                source.connect(scriptNode);
                scriptNode.connect(audioCtx.destination);

                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                state.isRecording = true;
                dom.btnRecord.classList.add('recording');
                const textSpan = dom.btnRecord.querySelector('span:last-child');
                textSpan.textContent = t('stopRecord');
                setFeedback(t('recording'), 'info');

            } catch (err) {
                console.error('錄音啟動失敗:', err);
                setFeedback('❌ ' + (err.message || '無法存取麥克風'), 'error');
                throw err;
            }
        }

        function stopPCMCapture() {
            return new Promise((resolve) => {
                if (!state.isRecording || !state.audioContext) {
                    resolve(null);
                    return;
                }

                state.isRecording = false;
                dom.btnRecord.classList.remove('recording');
                const textSpan = dom.btnRecord.querySelector('span:last-child');
                textSpan.textContent = t('startRecord');

                const chunks = state.pcmChunks;
                let totalLen = 0;
                for (const c of chunks) totalLen += c.length;
                const merged = new Int16Array(totalLen);
                let offset = 0;
                for (const c of chunks) {
                    merged.set(c, offset);
                    offset += c.length;
                }

                try {
                    if (state.scriptNode) {
                        state.scriptNode.disconnect();
                        state.scriptNode = null;
                    }
                    if (state.sourceNode) {
                        state.sourceNode.disconnect();
                        state.sourceNode = null;
                    }
                    if (state.audioContext && state.audioContext.state === 'running') {
                        state.audioContext.suspend().catch(() => {});
                    }
                } catch (e) { /* ignore */ }

                state.pcmChunks = [];
                dom.btnRecord.disabled = true;

                const buffer = merged.buffer;
                resolve(buffer);
            });
        }

        // ================================================================
        //  10. 語音辨識（訊飛 WebSocket）
        // ================================================================
        function recognizeWithXunfei(pcmBuffer, appid, apiKey, apiSecret) {
            return new Promise(async (resolve, reject) => {
                const host = 'iat-api.xfyun.cn';
                const path = '/v2/iat';

                let wsUrl;
                try {
                    wsUrl = await buildWsUrl(apiKey, apiSecret, appid, host, path);
                } catch (err) {
                    reject(new Error('簽名生成失敗: ' + err.message));
                    return;
                }

                const ws = new WebSocket(wsUrl);
                let resolved = false;
                let timeoutId = null;
                let resultText = '';

                const cleanup = () => {
                    if (timeoutId) { clearTimeout(timeoutId);
                        timeoutId = null; }
                    if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
                        try { ws.close(); } catch (e) { /* ignore */ }
                    }
                };

                const finish = (err, text) => {
                    if (resolved) return;
                    resolved = true;
                    cleanup();
                    if (err) reject(err);
                    else resolve(text || '');
                };

                timeoutId = setTimeout(() => {
                    finish(new Error('辨識超時（20秒）'));
                }, 20000);

                ws.onopen = () => {
                    const startFrame = {
                        common: { app_id: appid },
                        business: { language: 'zh_cn', domain: 'iat', accent: 'mandarin' },
                        data: { status: 0, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' }
                    };
                    ws.send(JSON.stringify(startFrame));

                    const audioData = new Uint8Array(pcmBuffer);
                    const chunkSize = 4000;
                    let offset = 0;
                    const totalLen = audioData.length;

                    function sendNextChunk() {
                        if (resolved) return;
                        if (offset >= totalLen) {
                            const endFrame = {
                                data: { status: 2, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' }
                            };
                            ws.send(JSON.stringify(endFrame));
                            return;
                        }
                        const end = Math.min(offset + chunkSize, totalLen);
                        const chunk = audioData.slice(offset, end);
                        const base64 = btoa(String.fromCharCode(...chunk));
                        const frame = {
                            data: {
                                status: 1,
                                format: 'audio/L16;rate=16000',
                                encoding: 'raw',
                                audio: base64
                            }
                        };
                        ws.send(JSON.stringify(frame));
                        offset = end;
                        if (offset < totalLen) {
                            setTimeout(sendNextChunk, 10);
                        } else {
                            const endFrame = {
                                data: { status: 2, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' }
                            };
                            ws.send(JSON.stringify(endFrame));
                        }
                    }

                    setTimeout(sendNextChunk, 50);
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.code && msg.code !== 0) {
                            finish(new Error(`訊飛錯誤: ${msg.code} - ${msg.message || '未知'}`));
                            return;
                        }

                        if (msg.data && msg.data.result && msg.data.result.ws) {
                            const wsArr = msg.data.result.ws;
                            let text = '';
                            for (const w of wsArr) {
                                if (w.cw) {
                                    for (const cw of w.cw) {
                                        if (cw.w) text += cw.w;
                                    }
                                }
                            }
                            if (text) {
                                resultText = text;
                            }
                        }

                        if (msg.data && msg.data.status === 2) {
                            finish(null, resultText);
                        }
                    } catch (err) {
                        finish(new Error('解析回應失敗: ' + err.message));
                    }
                };

                ws.onerror = (err) => {
                    finish(new Error('WebSocket 連線錯誤'));
                };

                ws.onclose = () => {
                    if (!resolved) {
                        finish(new Error('連線已關閉'));
                    }
                };
            });
        }

        // ================================================================
        //  11. 拼音維度評分（聲母 / 韻母 / 聲調）
        // ================================================================

        /**
         * 使用 pinyin-pro 獲取一個漢字的完整拼音資訊（含聲母、韻母、聲調數字）
         * 返回陣列，每個元素對應一個音節
         */
        function getPinyinParts(text) {
            const clean = removePunctuation(text);
            if (!clean) return [];
            // 使用 type: 'all' 一次取得聲母、韻母、聲調等所有資訊
            const result = pinyinPro.pinyin(clean, { type: 'all' });
            // 只保留漢字的音節
            return result.filter(item => item.isZh).map(item => ({
                origin: item.origin,
                initial: item.initial || '',
                final: item.final || '',
                num: item.num,  // 1-4, 轻声为 0
                polyphonic: item.polyphonic || [item.pinyin]
            }));
        }

        /**
         * 取得一個音節的所有可能讀音（處理多音字）
         * 返回陣列，每個元素為 { initial, final, num }
         */
        function getAllReadings(syllableInfo) {
            if (!syllableInfo.polyphonic || syllableInfo.polyphonic.length === 0) {
                return [{ initial: syllableInfo.initial, final: syllableInfo.final, num: syllableInfo.num }];
            }
            return syllableInfo.polyphonic.map(py => {
                // 從 polyphonic 拼音字串中解析出聲母、韻母、聲調
                const parsed = pinyinPro.pinyin(py, { type: 'all' });
                if (parsed.length > 0 && parsed[0].isZh) {
                    return {
                        initial: parsed[0].initial || '',
                        final: parsed[0].final || '',
                        num: parsed[0].num
                    };
                }
                // 降級：使用原始資訊
                return { initial: syllableInfo.initial, final: syllableInfo.final, num: syllableInfo.num };
            });
        }

        /**
         * 比較單個音節的三個維度（聲母、韻母、聲調），每個維度錯誤扣 1/3 分
         * 返回 0~1 之間的分數
         */
        function compareSyllable(recognizedSyl, targetSyl) {
            const readings = getAllReadings(targetSyl);
            let bestScore = 0;

            for (const reading of readings) {
                let correct = 0;
                // 聲母比對
                if (recognizedSyl.initial === reading.initial) correct++;
                // 韻母比對（去除聲調符號後比較基礎韻母）
                const recFinalBase = recognizedSyl.final.replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/g,
                    m => ({ 'ā': 'a', 'á': 'a', 'ǎ': 'a', 'à': 'a', 'ē': 'e', 'é': 'e', 'ě': 'e', 'è': 'e',
                        'ī': 'i', 'í': 'i', 'ǐ': 'i', 'ì': 'i', 'ō': 'o', 'ó': 'o', 'ǒ': 'o', 'ò': 'o',
                        'ū': 'u', 'ú': 'u', 'ǔ': 'u', 'ù': 'u', 'ǖ': 'ü', 'ǘ': 'ü', 'ǚ': 'ü', 'ǜ': 'ü'
                    }[m] || m));
                const tgtFinalBase = reading.final.replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/g,
                    m => ({ 'ā': 'a', 'á': 'a', 'ǎ': 'a', 'à': 'a', 'ē': 'e', 'é': 'e', 'ě': 'e', 'è': 'e',
                        'ī': 'i', 'í': 'i', 'ǐ': 'i', 'ì': 'i', 'ō': 'o', 'ó': 'o', 'ǒ': 'o', 'ò': 'o',
                        'ū': 'u', 'ú': 'u', 'ǔ': 'u', 'ù': 'u', 'ǖ': 'ü', 'ǘ': 'ü', 'ǚ': 'ü', 'ǜ': 'ü'
                    }[m] || m));
                if (recFinalBase === tgtFinalBase) correct++;
                // 聲調比對（數字）
                if (recognizedSyl.num === reading.num) correct++;

                const score = correct / 3;
                if (score > bestScore) bestScore = score;
            }

            return bestScore;
        }

        /**
         * 評分主函數：將識別文字與目標咒語都轉為拼音，逐音節比對三個維度
         * 最終得分 = 平均分 × 100，四捨五入取整
         */
        function evaluateSpell(recognizedText, targetSpell) {
            // 轉換為簡體（語音辨識通常返回簡體中文）
            const targetSimplified = toSimplified(targetSpell);
            const cleanTarget = removePunctuation(targetSimplified);
            const cleanRecognized = removePunctuation(recognizedText);

            if (!cleanTarget || !cleanRecognized) {
                return { score: 0, matchCount: 0, total: cleanTarget.length || 0, recognized: cleanRecognized,
                    target: cleanTarget };
            }

            // 取得拼音音節陣列
            const targetSyls = getPinyinParts(cleanTarget);
            const recSyls = getPinyinParts(cleanRecognized);

            if (targetSyls.length === 0) {
                return { score: 0, matchCount: 0, total: 0, recognized: cleanRecognized, target: cleanTarget };
            }

            // 逐音節比對，取最優對齊（識別結果可能多字或少字）
            // 以目標音節數為基準，為每個目標音節找最佳匹配的識別音節
            let totalScore = 0;
            let matchCount = 0;

            for (let i = 0; i < targetSyls.length; i++) {
                let bestForTarget = 0;
                // 在識別結果中尋找最佳匹配（允許位置偏移）
                for (let j = 0; j < recSyls.length; j++) {
                    const s = compareSyllable(recSyls[j], targetSyls[i]);
                    if (s > bestForTarget) bestForTarget = s;
                }
                totalScore += bestForTarget;
                if (bestForTarget > 0) matchCount++;
            }

            const avgScore = totalScore / targetSyls.length;
            const score = Math.round(avgScore * 100);

            return {
                score,
                matchCount,
                total: targetSyls.length,
                recognized: cleanRecognized,
                target: cleanTarget
            };
        }

        // ================================================================
        //  12. 戰鬥邏輯
        // ================================================================
        async function processBattle(effect, spellKey, enemy, score) {
            if (!enemy) return;
            if (state.battleProcessing) return;
            state.battleProcessing = true;
            updateUI();

            state.lastEffect = effect;

            if (score === 0) {
                state.enemyStatus = 'attacking';
                state.lives -= 1;
                state.damageTaken.push({ text: '-1 ❤️‍🔥' });
                if (state.lives <= 0) {
                    state.lives = 0;
                    state.gameOver = true;
                    state.victory = false;
                }
                renderEnemy();
                updateUI();
                if (state.gameOver) {
                    showGameOver(false);
                }
                state.battleProcessing = false;
                return;
            }

            let damage = 0;
            let isCritical = false;
            let killed = false;
            let penaltyMsg = '';

            switch (effect) {
                case 'effective':
                    damage = Math.round(score * 1.0);
                    break;
                case 'weak':
                    damage = Math.round(score * 0.5);
                    break;
                case 'ineffective':
                    damage = 0;
                    break;
                case 'overkill':
                    damage = Math.round(score * 5);
                    state.score = state.score - 10;
                    penaltyMsg = t('overkillPenalty');
                    isCritical = true;
                    break;
                default:
                    damage = 0;
            }

            const actualDamage = Math.min(damage, state.enemyHp);
            state.enemyHp -= actualDamage;

            if (state.enemyHp <= 0 || damage >= 60) {
                state.enemyHp = 0;
                killed = true;
                let bonus = 10;
                if (score >= 90) bonus += 5;
                else if (score >= 75) bonus += 2;
                state.score += bonus;
                state.enemiesDefeated++;
                let feedbackMsg = t('scoreGain', { n: bonus }) + ' 🎉';
                if (penaltyMsg) {
                    feedbackMsg = penaltyMsg + '，' + feedbackMsg;
                }
                setFeedback(feedbackMsg, 'success');
            } else {
                if (penaltyMsg) {
                    setFeedback(penaltyMsg, 'error');
                }
            }

            let attackStatus = 'default';
            const pos = state.selectedPos;
            if (effect === 'effective') {
                attackStatus = 'expelliarmus';
            } else if (effect === 'weak') {
                attackStatus = 'stupefy';
            } else if (effect === 'overkill') {
                attackStatus = 'petrificus';
            } else if (effect === 'ineffective') {
                if (pos === 'wand') attackStatus = 'expelliarmus';
                else if (pos === 'body') attackStatus = 'petrificus';
                else if (pos === 'forehead') attackStatus = 'stupefy';
                else if (pos === 'defense') attackStatus = 'patronus';
                else attackStatus = 'default';
            }

            let damageText = `-${actualDamage}`;
            let damageCls = '';
            if (killed) damageCls = 'critical';
            else if (actualDamage === 0) damageCls = 'ineffective';
            if (actualDamage > 0 || killed) {
                state.damageDealt.push({ text: damageText, cls: damageCls });
            } else {
                state.damageDealt.push({ text: '0', cls: 'ineffective' });
            }

            state.enemyStatus = attackStatus;
            renderEnemy();
            updateUI();

            await sleep(2000);

            if (killed) {
                state.enemyStatus = 'defeated';
                state.enemyDefeated = true;
                if (state.enemiesDefeated >= 3) {
                    state.gameOver = true;
                    state.victory = true;
                    showGameOver(true);
                }
                renderEnemy();
                updateUI();
                state.battleProcessing = false;
                return;
            } else {
                let counterAttack = false;
                if (effect === 'ineffective') {
                    counterAttack = true;
                } else if (effect === 'weak') {
                    counterAttack = (Math.random() >= 0.5);
                } else if (effect === 'effective' || effect === 'overkill') {
                    counterAttack = false;
                } else {
                    counterAttack = false;
                }

                if (counterAttack) {
                    state.enemyStatus = 'attacking';
                    state.lives -= 1;
                    state.damageTaken.push({ text: '-1 ❤️‍🔥' });
                    if (state.lives <= 0) {
                        state.lives = 0;
                        state.gameOver = true;
                        state.victory = false;
                    }
                    renderEnemy();
                    updateUI();
                    if (state.gameOver) {
                        showGameOver(false);
                    }
                } else {
                    state.enemyStatus = 'default';
                    renderEnemy();
                    updateUI();
                }
                state.battleProcessing = false;
                return;
            }
        }

        // ================================================================
        //  13. UI 更新
        // ================================================================
        function updateUI() {
            dom.scoreDisplay.textContent = state.score;
            dom.livesDisplay.textContent = state.lives;
            dom.livesDisplay.style.color = state.lives <= 1 ? '#ff6b5a' : '#f0e6d3';

            const takenContainer = dom.damageTakenContainer;
            takenContainer.innerHTML = '';
            for (const item of state.damageTaken) {
                const div = document.createElement('div');
                div.className = 'taken-item';
                div.textContent = item.text;
                takenContainer.appendChild(div);
            }

            updateButtonsLang();

            const hasEnemy = state.currentEnemy && state.enemyHp > 0 && !state.enemyDefeated && !state.gameOver;
            const canRecord = hasEnemy && !state.isRecording && !state.recognizing && !state.evaluating && !state
                .battleProcessing;
            dom.btnRecord.disabled = !canRecord;

            document.querySelectorAll('.spell-btn').forEach(el => {
                const pos = el.dataset.pos;
                el.classList.toggle('active', pos === state.selectedPos);
                const enabled = hasEnemy && !state.battleProcessing;
                el.style.opacity = enabled ? '1' : '0.4';
                el.style.pointerEvents = enabled ? 'auto' : 'none';
            });

            dom.btnAdventure.disabled = state.battleProcessing;

            // 以金光標示最有效的咒語
            updateBestSpellGlow();
        }

        // 標示對當前敵人「最有效」的咒語按鈕（金光引導）
        function updateBestSpellGlow() {
            const enemy = state.currentEnemy;
            const active = !!(enemy && state.enemyHp > 0 && !state.enemyDefeated && !state.gameOver);
            document.querySelectorAll('.spell-btn').forEach(el => {
                let isBest = false;
                if (active) {
                    const spellKey = POS_TO_SPELL[el.dataset.pos];
                    const eff = SPELLS[spellKey]?.effects[enemy.id];
                    isBest = (eff === 'effective');
                }
                el.classList.toggle('best', isBest);
            });
        }

        function renderEnemy() {
            const enemy = state.currentEnemy;

            const dealtContainer = dom.damageDealtContainer;
            dealtContainer.innerHTML = '';
            for (const item of state.damageDealt) {
                const div = document.createElement('div');
                div.className = 'dealt-item' + (item.cls ? ' ' + item.cls : '');
                div.textContent = item.text;
                dealtContainer.appendChild(div);
            }

            if (!enemy) {
                dom.enemyAvatar.innerHTML = `<span class="emoji-fallback">🪄</span>`;
                dom.enemyName.innerHTML = `<span data-i18n="waiting">${t('waiting')}</span>`;
                dom.enemyStatusText.textContent = t('clickStart');
                dom.enemyHpFill.style.width = '0%';
                dom.enemyHpFill.className = 'enemy-hp-fill';
                return;
            }

            const name = getEnemyName(enemy);
            const hpPercent = state.enemyHp > 0 ? (state.enemyHp / enemy.hp) * 100 : 0;

            const statusIdx = STATUS_INDEX[state.enemyStatus] ?? 0;
            const imgPath = `images/${enemy.id}_${statusIdx}.png`;
            const avatarEl = dom.enemyAvatar;
            const img = document.createElement('img');
            img.onload = () => {
                avatarEl.innerHTML = '';
                avatarEl.appendChild(img);
            };
            img.onerror = () => {
                avatarEl.innerHTML = `<span class="emoji-fallback">${enemy.emoji}</span>`;
            };
            img.src = imgPath;
            img.alt = name;
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'cover';

            dom.enemyName.innerHTML = `<span>${name}</span>`;

            // 只顯示血量，不使用文字標記效果或狀態
            dom.enemyStatusText.textContent = `${t('hp')}: ${Math.max(0, state.enemyHp)}/${enemy.hp}`;

            dom.enemyHpFill.style.width = Math.max(0, hpPercent) + '%';
            dom.enemyHpFill.className = 'enemy-hp-fill' + (hpPercent < 25 ? ' low' : '');

            updateUI();
        }

        function updateSpellDisplay() {
            const display = dom.spellDisplay;
            if (!state.selectedPos) {
                display.innerHTML = `<div class="empty-hint" data-i18n="selectSpell">${t('selectSpell')}</div>`;
                return;
            }
            const spellInfo = getSpellDisplay(state.selectedPos);
            display.innerHTML = `
                <div class="spell-pinyin">${spellInfo.pinyin}</div>
                <div class="spell-chars">${spellInfo.chars}</div>
            `;
        }

        function setFeedback(msg, type = '') {
            const el = dom.feedback;
            el.textContent = msg;
            el.className = 'feedback' + (type ? ' ' + type : '');
        }

        function showGameOver(victory) {
            const overlay = dom.gameOverOverlay;
            overlay.classList.add('show');
            if (victory) {
                dom.gameOverTitle.className = 'big-text victory';
                dom.gameOverTitle.textContent = t('victory');
                dom.gameOverSub.textContent = t('victorySub') + ` (${t('score')}: ${state.score})`;
            } else {
                dom.gameOverTitle.className = 'big-text';
                dom.gameOverTitle.textContent = t('gameOver');
                dom.gameOverSub.textContent = t('gameOverSub');
            }
        }

        function updateStatusText() {
            renderEnemy();
            updateSpellDisplay();
            setFeedback(t('ready'), '');
        }

        // ================================================================
        //  14. 核心流程
        // ================================================================

        function startAdventure() {
            if (state.gameOver) {
                resetGame();
                setTimeout(() => startAdventure(), 100);
                return;
            }

            if (state.currentEnemy && state.enemyHp > 0 && !state.enemyDefeated && !state.gameOver) {
                fleeBattle();
                return;
            }

            if (state.enemyDefeated) {
                if (state.enemiesDefeated >= 3) {
                    return;
                }
                loadNextEnemy();
                return;
            }

            if (state.enemyOrder.length === 0) {
                const ids = ENEMIES.map(e => e.id);
                state.enemyOrder = shuffleArray(ids);
                state.currentEnemyIndex = 0;
                state.enemiesDefeated = 0;
                loadEnemyByIndex(0);
            } else {
                loadEnemyByIndex(0);
            }
        }

        function fleeBattle() {
            if (!state.currentEnemy) return;
            state.gameOver = true;
            state.victory = false;
            showGameOver(false);
            updateButtonsLang();
            dom.btnRecord.disabled = true;
            state.battleProcessing = false;
            setFeedback('🏃 你逃跑了，挑戰失敗！', 'error');
        }

        function loadEnemyByIndex(index) {
            if (index >= state.enemyOrder.length) {
                return;
            }
            const enemyId = state.enemyOrder[index];
            const enemy = ENEMIES.find(e => e.id === enemyId);
            if (!enemy) return;

            state.currentEnemy = enemy;
            state.enemyHp = enemy.hp;
            state.enemyStatus = 'default';
            state.enemyDefeated = false;
            state.damageDealt = [];
            state.damageTaken = [];
            state.lastEffect = null;
            state.selectedPos = null;
            state.currentSpellKey = null;
            state.battleProcessing = false;

            dom.gameOverOverlay.classList.remove('show');
            document.querySelectorAll('.spell-btn').forEach(el => el.classList.remove('active'));
            updateSpellDisplay();
            renderEnemy();
            setFeedback(`⚔️ ${getEnemyName(enemy)} 出現了！`, 'info');
            updateUI();
            dom.btnRecord.disabled = true;
        }

        function loadNextEnemy() {
            const nextIndex = state.currentEnemyIndex + 1;
            if (nextIndex >= state.enemyOrder.length) {
                return;
            }
            state.currentEnemyIndex = nextIndex;
            loadEnemyByIndex(nextIndex);
        }

        function resetGame() {
            state.score = 0;
            state.lives = 3;
            state.gameOver = false;
            state.victory = false;
            state.enemyOrder = [];
            state.currentEnemyIndex = 0;
            state.enemiesDefeated = 0;
            state.currentEnemy = null;
            state.enemyHp = 0;
            state.enemyStatus = 'default';
            state.enemyDefeated = false;
            state.selectedPos = null;
            state.currentSpellKey = null;
            state.battleProcessing = false;
            state.damageDealt = [];
            state.damageTaken = [];
            state.lastEffect = null;

            dom.gameOverOverlay.classList.remove('show');
            dom.btnAdventure.className = 'btn-primary';

            renderEnemy();
            updateSpellDisplay();
            setFeedback(t('ready'), '');
            updateUI();
            dom.btnRecord.disabled = true;
        }

        // ================================================================
        //  14-2. 選擇咒語
        // ================================================================
        function selectSpell(pos) {
            if (state.gameOver || !state.currentEnemy || state.enemyDefeated) {
                setFeedback('⚠️ ' + (state.gameOver ? t('gameOver') : t('clickStart')), 'error');
                return;
            }
            if (state.isRecording || state.recognizing || state.battleProcessing) {
                setFeedback('⏳ 請先完成目前動作', 'error');
                return;
            }

            state.selectedPos = pos;
            state.currentSpellKey = POS_TO_SPELL[pos];

            document.querySelectorAll('.spell-btn').forEach(el => {
                el.classList.toggle('active', el.dataset.pos === pos);
            });

            // 咒語名稱一律顯示中文（不隨語言切換翻譯）
            const spellInfo = getSpellDisplay(pos);
            const spellName = spellInfo.chars;
            setFeedback(`✨ ${spellName}`, 'info');

            updateSpellDisplay();
            dom.btnRecord.disabled = false;
        }

        // ================================================================
        //  15. 錄音相關
        // ================================================================
        async function toggleRecording() {
            if (state.isRecording) {
                await stopAndRecognize();
                return;
            }

            if (!state.currentEnemy || state.enemyHp <= 0 || state.enemyDefeated || state.gameOver) {
                setFeedback('⚠️ ' + t('clickStart'), 'error');
                return;
            }
            if (!state.selectedPos) {
                setFeedback('👆 ' + t('selectSpell'), 'error');
                return;
            }
            if (state.battleProcessing) {
                setFeedback('⏳ 戰鬥進行中，請稍候', 'error');
                return;
            }

            try {
                await startPCMCapture();
                dom.btnRecord.disabled = false;
                const textSpan = dom.btnRecord.querySelector('span:last-child');
                textSpan.textContent = t('stopRecord');
                setFeedback(t('recording'), 'info');
            } catch (err) {
                setFeedback('❌ ' + (err.message || '錄音失敗'), 'error');
                dom.btnRecord.disabled = true;
            }
        }

        async function stopAndRecognize() {
            if (!state.isRecording) return;
            if (state.recognizing || state.evaluating || state.battleProcessing) return;

            dom.btnRecord.disabled = true;
            setFeedback(t('recognizing'), 'info');
            state.recognizing = true;

            try {
                const pcmBuffer = await stopPCMCapture();
                if (!pcmBuffer || pcmBuffer.byteLength === 0) {
                    setFeedback('⚠️ 沒有錄到聲音，請再試一次', 'error');
                    state.recognizing = false;
                    dom.btnRecord.disabled = false;
                    dom.btnRecord.querySelector('span:last-child').textContent = t('startRecord');
                    return;
                }

                setFeedback(t('recognizing') + ' ...', 'info');
                const recognizedText = await recognizeWithXunfei(pcmBuffer, APPID, API_KEY, API_SECRET);
                state.recognizing = false;

                if (!recognizedText || recognizedText.trim() === '') {
                    setFeedback('⚠️ 未辨識到語音，請再試一次', 'error');
                    dom.btnRecord.disabled = false;
                    dom.btnRecord.querySelector('span:last-child').textContent = t('startRecord');
                    return;
                }

                const targetSpell = state.currentSpellKey;
                const evalResult = evaluateSpell(recognizedText, targetSpell);
                const score = evalResult.score;

                setFeedback(`📊 ${t('score_label')}: ${score}%  (${evalResult.matchCount}/${evalResult.total})`, 'info');

                const displayMsg = `${t('recognitionResult')}: "${recognizedText}"  |  ${t('matchRate')}: ${score}%`;
                setFeedback(displayMsg, score >= 60 ? 'success' : 'error');

                const enemy = state.currentEnemy;
                if (enemy && state.enemyHp > 0) {
                    const spell = SPELLS[targetSpell];
                    const effect = spell?.effects[enemy.id] || 'ineffective';
                    await processBattle(effect, targetSpell, enemy, score);
                    renderEnemy();
                    updateUI();
                    if (state.gameOver) {
                        showGameOver(state.victory);
                    }
                    if (state.enemyDefeated) {
                        dom.btnAdventure.disabled = false;
                    }
                    const hasEnemy = state.currentEnemy && state.enemyHp > 0 && !state.enemyDefeated && !state.gameOver;
                    dom.btnRecord.disabled = !(hasEnemy && !state.battleProcessing && state.selectedPos);
                    dom.btnRecord.querySelector('span:last-child').textContent = t('startRecord');
                }

            } catch (err) {
                console.error('辨識錯誤:', err);
                setFeedback('❌ ' + (err.message || '辨識失敗，請再試一次'), 'error');
                state.recognizing = false;
                dom.btnRecord.disabled = false;
                dom.btnRecord.querySelector('span:last-child').textContent = t('startRecord');
                if (state.isRecording) {
                    try { await stopPCMCapture(); } catch (e) { /* ignore */ }
                }
            } finally {
                state.recognizing = false;
                if (state.isRecording) {
                    try { await stopPCMCapture(); } catch (e) { /* ignore */ }
                }
                dom.btnRecord.classList.remove('recording');
                dom.btnRecord.querySelector('span:last-child').textContent = t('startRecord');
                const hasEnemy = state.currentEnemy && state.enemyHp > 0 && !state.enemyDefeated && !state.gameOver;
                dom.btnRecord.disabled = !(hasEnemy && !state.battleProcessing && state.selectedPos);
                updateUI();
            }
        }

        // ================================================================
        //  16. 事件綁定 & 初始化
        // ================================================================
        function initEvents() {
            dom.langToggle.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn || !btn.dataset.lang) return;
                if (btn.dataset.lang === currentLang) return;
                setLang(btn.dataset.lang);
            });

            dom.btnAdventure.addEventListener('click', startAdventure);

            dom.spellSelector.addEventListener('click', (e) => {
                const btn = e.target.closest('.spell-btn');
                if (!btn || !btn.dataset.pos) return;
                selectSpell(btn.dataset.pos);
            });

            dom.btnRecord.addEventListener('click', toggleRecording);

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (!dom.btnRecord.disabled) {
                        dom.btnRecord.click();
                    }
                }
            });
        }

        function init() {
            // 確認 pinyin-pro 已載入
            if (typeof pinyinPro === 'undefined') {
                console.error('❌ pinyin-pro 未載入，語音評分功能可能受影響');
            } else {
                console.log('✅ pinyin-pro 已載入，拼音維度評分已啟用');
            }

            setLang('zh');
            resetGame();
            initEvents();
            updateUI();
            setFeedback(t('ready'), '');
            dom.btnRecord.disabled = true;
            preloadMicrophone().catch(() => {});
            console.log('⚡ 可譽波特 · 魔法對決 已啟動 (拼音維度評分版)');
            setTimeout(() => startAdventure(), 300);
        }

        document.addEventListener('DOMContentLoaded', init);

        window.__state = state;
        window.__debug = {
            startAdventure,
            selectSpell,
            toggleRecording,
            resetGame,
            renderEnemy,
            updateUI,
            setLang,
            evaluateSpell,
            getPinyinParts,
        };
    </script>

</body>
</html>
